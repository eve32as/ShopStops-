openapi: 3.1.0
info:
  title: ShopStops Delivery API
  version: 1.0.0
  description: >
    Versioned public contract. Put the API behind an authenticated gateway; its
    shared bearer token is for internal service traffic only.
servers:
  - url: https://api.shopstops.example/v1
    description: Public gateway; strips /v1 before forwarding to the API service
security:
  - bearerAuth: []
paths:
  /admin/shopper/tasks:
    post:
      operationId: assignShopperTask
      summary: Admin supervised assignment to one existing merchant order
      description: Requires gateway-verified admin actor. 8 KiB JSON limit. Explicit positive approved USD completion amount is immutable; no planner defaults or priority allocations. One assignment per order; no reassignment. Eligibility stays pending_review. Assignment, signup, login and acceptance create no earnings. Customer/payment binding is checked server-side; missing or failed payment is a review fact, not automatic forfeiture of compensation.
      parameters:
        - $ref: '#/components/parameters/ShopperIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopperAssignment'
      responses:
        '201':
          description: Recorded assignment or identical retry (may already be completed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperTask'
        '400': { description: Invalid strict JSON, UUID, references, amount or cancelled order }
        '401': { description: Authentication required }
        '403': { description: Verified admin role required }
        '404': { description: Existing order not found }
        '409': { description: Order already assigned, payer binding or actor/payload idempotency conflict }
        '503': { description: Shopper repository or migration unavailable }
    get:
      operationId: listShopperTasks
      summary: Admin bounded task and pending earnings records
      description: Ordered by assignment timestamp and UUID, no raw customer identity or payment details. No payable or paid claims.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: Bounded task page
          content:
            application/json:
              schema:
                type: object
                required: [tasks, limit, offset]
                properties:
                  tasks:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/ShopperTask'
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { description: Invalid pagination or actor }
        '401': { description: Authentication required }
        '403': { description: Verified admin role required }
        '503': { description: Shopper repository or migration unavailable }
  /admin/shopper/tasks/{taskId}/complete:
    post:
      operationId: completeShopperTask
      summary: Admin verified shopping completion and pending-review earnings
      description: Atomic one-time completion, audit and earned_per_order ledger entry at the assigned immutable completion amount. Requires explicit item-shopping and authorized substitutions (or none needed) confirmation, plus private opaque receipt and handoff proof references. Verifier comes only from trusted gateway admin headers. Payment status is observed, not a compensation forfeiture gate. No transfers, payroll approval, enrollment or legal clearance; all earnings remain pending_review. Legally required compensable time and other wage obligations require separate compliance/payroll handling.
      parameters:
        - $ref: '#/components/parameters/ShopperIdempotencyKey'
        - in: path
          name: taskId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopperCompletion'
      responses:
        '200':
          description: Verified completion and pending earnings, or identical retry; no money transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperTask'
        '400': { description: Invalid JSON, UUID or incomplete evidence }
        '401': { description: Authentication required }
        '403': { description: Verified admin role required }
        '404': { description: Task or order not found }
        '409': { description: Already completed with another key, ownership change, or actor/payload/key conflict }
        '503': { description: Shopper repository or migration unavailable }
  /healthz:
    get:
      operationId: healthCheck
      summary: Check API and database readiness
      security: []
      responses:
        '200':
          description: API and database are ready
        '503':
          description: Database unavailable
  /stores/{storeLocationId}/nearby-merchants:
    get:
      operationId: findNearbySubscribedMerchants
      summary: Find eligible grocery and retail merchants within 500 meters
      parameters:
        - in: path
          name: storeLocationId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: radiusMeters
          schema:
            type: integer
            minimum: 0
            maximum: 500
            default: 500
      responses:
        '200':
          description: Active, subscription-positive nearby merchants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyMerchant'
        '404':
          description: Anchor store not found
  /stores/{storeLocationId}/catalog:
    get:
      operationId: getStoreCatalog
      summary: List available catalog items for a visible subscribed storefront
      parameters:
        - in: path
          name: storeLocationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Available catalog items with current prices and delivery-volume estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogItem'
        '404':
          description: Storefront is unavailable
  /orders:
    post:
      operationId: createCustomerOrder
      summary: Create an authenticated customer's order from one store catalog
      description: Prices, volume, customer identity, and delivery-zone membership are resolved server-side. The request is idempotent.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerOrder'
      responses:
        '201':
          description: Order created or returned for an idempotent retry
          content:
            application/json:
              schema:
                type: object
                required: [id, status, itemSubtotalCents]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [placed]
                  itemSubtotalCents:
                    type: integer
                    minimum: 1
        '400':
          description: Invalid order details or authenticated customer identity is missing
        '404':
          description: Storefront, catalog item, or delivery zone unavailable
        '409':
          description: Idempotency key conflicts or item is no longer available
  /merchant/catalog:
    get:
      operationId: getMerchantCatalog
      summary: List catalog items belonging to the authenticated merchant
      description: Requires the trusted gateway to inject the authenticated merchant UUID and merchant role. Includes unavailable items for editing.
      responses:
        '200':
          description: Items across the merchant's store locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantCatalogItem'
        '403':
          description: Merchant role required
        '404':
          description: Merchant not found
    post:
      operationId: createMerchantCatalogItem
      summary: Add a catalog item to one of the merchant's store locations
      description: The database verifies store ownership. Price and volume are validated and used for future orders only. Requires an idempotency key.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantCatalogItem'
      responses:
        '201':
          description: Item created or returned after an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantCatalogItem'
        '400':
          description: Invalid catalog item or idempotency key
        '403':
          description: Merchant role required
        '404':
          description: Merchant or owned store location not found
  /merchant/store-locations:
    get:
      operationId: getMerchantStoreLocations
      summary: List store locations owned by the authenticated merchant
      description: Requires the trusted gateway to inject the authenticated merchant UUID and merchant role.
      responses:
        '200':
          description: Merchant's store locations available for catalog management
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
        '403':
          description: Merchant role required
        '404':
          description: Merchant not found
        '409':
          description: Idempotency key conflicts with a different create request
  /merchant/catalog/{itemId}:
    patch:
      operationId: updateMerchantCatalogItem
      summary: Update or hide one of the authenticated merchant's catalog items
      description: The database verifies item ownership. Price and name changes do not alter snapshots on existing orders.
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMerchantCatalogItem'
      responses:
        '200':
          description: Catalog item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantCatalogItem'
        '400':
          description: Invalid catalog item
        '403':
          description: Merchant role required
        '404':
          description: Catalog item not found for merchant
  /checkout-pricing/priority:
    get:
      operationId: getPriorityTestPricing
      summary: Authenticated customer priority service test pricing
      description: No dummy prices. Disabled by default; amounts only present when explicit server test configuration is valid. This read-only route does not enable public checkout/payment routes, which remain gateway-blocked. Never a faster driving or arrival-time guarantee.
      responses:
        '200':
          description: Current configuration, not a reserved quote. Stored checkout prices remain stable on retries.
          content:
            application/json:
              schema:
                type: object
                required: [available, testOnly, currency, publicCheckoutAvailable]
                properties:
                  available: { type: boolean }
                  testOnly: { type: boolean, enum: [true] }
                  currency: { type: string, enum: [usd] }
                  publicCheckoutAvailable: { type: boolean, enum: [false] }
                  shoppingCents: { type: integer, minimum: 1, maximum: 1000000 }
                  deliveryCents: { type: integer, minimum: 1, maximum: 1000000 }
                  totalCents: { type: integer, minimum: 2, maximum: 2000000 }
        '401':
          description: Authentication required
        '403':
          description: Customer role required
  /checkouts:
    post:
      operationId: createUnifiedCheckout
      summary: Create a unified basket with one anchor and at most one adjacent merchant
      description: Currently blocked by the public gateway; trusted internal integration only. Backend requires customer role and derives customer_ref solely from the trusted actor header (no customerRef request field). All fees are server configured, never planner/client inputs. Priority choice is atomically persisted with separate test-only shopping/delivery surcharge and pending allocation snapshots. New opt-ins reject disabled configuration; identical retries retain stored prices even after rates change or disable.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutRequest'
      responses:
        '201':
          description: Checkout created and itemized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '200':
          description: Existing checkout returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '400':
          description: Invalid basket or delivery location
        '409':
          description: Disabled priority choice, conflicting idempotency request, more than two merchants or an ineligible merchant
  /checkouts/{checkoutId}/payment:
    post:
      operationId: createCheckoutPayment
      summary: Create a Stripe PaymentIntent for the itemized checkout
      description: Currently gateway-blocked. Backend requires customer role and persisted checkout ownership. Selected priority or enabled extra-pickup test snapshots require a positively identified Stripe test-key gateway even after configuration changes, before creating or retrieving an intent. Exact stored invoice total includes the extra pickup platform fee once. No new worker payouts.
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
      responses:
        '200':
          description: Stripe PaymentIntent client configuration
          content:
            application/json:
              schema:
                type: object
                required: [paymentIntentId, clientSecret, status, amountCents, currency]
                properties:
                  paymentIntentId:
                    type: string
                  clientSecret:
                    type: string
                  status:
                    type: string
                  amountCents:
                    type: integer
                  currency:
                    type: string
                    enum: [usd]
                  testOnly:
                    type: boolean
        '401':
          description: Internal API authentication required
        '404':
          description: Checkout not found for the authenticated customer
        '409':
          description: Checkout is not payable or merchant payouts are not configured
        '503':
          description: Payment processing is unavailable
  /driver/routes/{routeId}:
    get:
      operationId: getDriverRoute
      summary: Get the assigned immutable route and routing legs
      description: The trusted API gateway injects X-ShopStops-Actor from the authenticated driver identity.
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200':
          description: Ordered route waypoints and route matrix data
        '403':
          description: Route is not assigned to this driver
        '404':
          description: Route not found
  /driver/routes/{routeId}/location:
    post:
      operationId: recordDriverLocation
      summary: Record driver location during an active route
      description: Driver clients should send samples every five seconds while active.
      parameters:
        - $ref: '#/components/parameters/RouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLocation'
      responses:
        '202':
          description: Location accepted
        '400':
          description: Invalid or too-frequent location sample
        '403':
          description: Route is not assigned to this driver
  /driver/routes/{routeId}/stops/{stopId}/events:
    post:
      operationId: recordUnifiedRouteStopEvent
      summary: Confirm arrival or completion of the current assigned route stop
      description: Requires the assigned driver identity. Stop events are idempotent and the API enforces the server-defined stop sequence. Use arrive before complete for each stop.
      parameters:
        - $ref: '#/components/parameters/RouteId'
        - in: path
          name: stopId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRouteStopEvent'
      responses:
        '200':
          description: Stop event accepted or returned for an identical retry
          content:
            application/json:
              schema:
                type: object
                required: [stopId, stopStatus, routeStatus]
                properties:
                  stopId:
                    type: string
                    format: uuid
                  stopStatus:
                    type: string
                    enum: [arrived, completed]
                  routeStatus:
                    type: string
                    enum: [in_progress, completed]
        '400':
          description: Invalid stop event
        '403':
          description: Route is not assigned to this driver
        '404':
          description: Route or stop not found
        '409':
          description: Event conflicts with stop state or mandatory route order
  /merchant/subscription/setup-intent:
    post:
      operationId: createMerchantBillingSetupIntent
      summary: Create a SetupIntent for the authenticated merchant billing method
      description: The trusted gateway must inject the authenticated merchant UUID and merchant role. The returned client secret is usable only to set up that merchant's payment method.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Stripe SetupIntent client configuration
        '403':
          description: Merchant role required
        '404':
          description: Merchant not found
        '409':
          description: Billing customer requires reconciliation
        '503':
          description: Stripe billing is unavailable
  /merchant/subscription:
    get:
      operationId: getMerchantSubscription
      summary: Get merchant SaaS subscription status
      description: The trusted gateway injects the authenticated merchant UUID and merchant role.
      responses:
        '200':
          description: Monthly subscription amount and billing status
        '403':
          description: Merchant identity required
    post:
      operationId: createMerchantSubscription
      summary: Start the fixed $199 monthly merchant subscription
      description: Requires a saved merchant billing payment method. Stripe charges on the next monthly billing anchor; visibility is not enabled until the subscription invoice is paid.
      responses:
        '202':
          description: Subscription created and awaiting first successful billing event
        '403':
          description: Merchant role required
        '409':
          description: Payment method missing or existing billing operation requires reconciliation
        '503':
          description: Stripe merchant price or billing credentials are unavailable
  /admin/checkouts/{checkoutId}/refund:
    post:
      operationId: refundCheckout
      summary: Issue a full remaining refund for a paid checkout
      description: Admin-only. Transfer reversals are separately created for each merchant payout after Stripe confirms the refund. Requires an idempotency key.
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [duplicate, fraudulent, requested_by_customer]
      responses:
        '202':
          description: Refund accepted by Stripe and awaiting refund webhook confirmation
        '400':
          description: Invalid checkout, idempotency key, or refund reason
        '403':
          description: Admin role required
        '404':
          description: Checkout not found
        '409':
          description: Payment not refundable or prior Stripe operation requires reconciliation
        '503':
          description: Stripe billing is unavailable
  /admin/finance/scenarios:
    post:
      operationId: calculateFinanceScenario
      summary: Admin estimate-only monthly finance planner
      description: Requires a verified admin actor. Pure calculator; no DB, checkout charges, earned wages or payouts. USD integer cents; 8 KiB maximum body. Bundle base plus distance/time is amortized per checkout drop. Only processing excess after merchant allocation is a platform input. Merchandise, tax and tips are excluded from the revenue denominator; subscriptions are assumed, not verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceScenario'
      responses:
        '200':
          description: Estimate; break-even is null when exact contribution is nonpositive, otherwise ceiling after fixed subscription offset. Net margin is null with zero platform revenue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceScenarioResult'
        '400':
          description: Invalid bounded integer inputs, actor, JSON or oversized body
        '401':
          description: Authentication required
        '403':
          description: Admin role required
  /admin/finance/costs:
    get:
      operationId: getManualFinanceCosts
      summary: Admin manual cost report for a UTC accounting month
      description: Append-only expense observations, not proof of earned compensation or payment. Total includes all records in the month; costs page ordered by server timestamp then UUID. No automatic scenario import.
      parameters:
        - in: query
          name: period
          required: true
          schema:
            $ref: '#/components/schemas/FinancePeriod'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: Manual cost report, not a paid ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCostReport'
        '400':
          description: Invalid period, pagination or actor
        '401':
          description: Authentication required
        '403':
          description: Admin role required
        '503':
          description: Optional finance repository or migration unavailable
    post:
      operationId: recordManualFinanceCost
      summary: Append a nonnegative manual expense observation (no payment)
      description: Requires verified admin actor; 8 KiB body cap. UUID Idempotency-Key is the record ID. Identical payload and actor retries return the same record; any differing payload or actor conflicts. No wage approval, paid status, refund execution or payout side effects.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCostRequest'
      responses:
        '201':
          description: Manual cost created or unchanged idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCost'
        '400':
          description: Invalid UUID key, cost, actor or request body
        '401':
          description: Authentication required
        '403':
          description: Admin role required
        '409':
          description: Same UUID with differing actor or payload
        '503':
          description: Optional finance repository or migration unavailable
  /webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      summary: Process idempotent Stripe Connect and Billing events
      description: Configure subscription, invoice, SetupIntent, refund, and dispute event types in addition to checkout PaymentIntent events.
      security: []
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event recorded, already processed, or retried transfers completed
        '400':
          description: Signature or event invalid
        '503':
          description: Event could not be processed; Stripe should retry it
  /dispatch/bundles:
    post:
      operationId: createDeliveryBundle
      summary: Bundle eligible nearby orders and create an ordered stop queue
      description: Requires a dispatch or admin role. The request is idempotent.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBundleRequest'
      responses:
        '201':
          description: Bundle created and activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '200':
          description: Existing result returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          description: Invalid limits or ineligible seed order
        '401':
          description: Authentication required
        '403':
          description: Dispatch/admin role required
        '409':
          description: Seed order is unavailable or reserved
  /driver/bundles/{bundleId}:
    get:
      operationId: getDriverBundle
      summary: Get an assigned bundle and its ordered stops
      description: Drivers can only retrieve bundles assigned to their identity.
      parameters:
        - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          description: Bundle and ordered stops
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '401':
          description: Authentication required
        '403':
          description: Bundle is not assigned to this driver
        '404':
          description: Bundle not found
  /driver/bundles/{bundleId}/stops/{stopId}/events:
    post:
      operationId: recordStopEvent
      summary: Record an idempotent driver stop event
      parameters:
        - $ref: '#/components/parameters/BundleId'
        - in: path
          name: stopId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopEvent'
      responses:
        '200':
          description: Event accepted or previously accepted
        '400':
          description: Invalid event or state transition
        '403':
          description: Bundle is not assigned to this driver
        '404':
          description: Bundle or stop not found
        '409':
          description: Event conflicts with current stop state
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ShopperIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, format: uuid }
    CheckoutId:
      in: path
      name: checkoutId
      required: true
      schema:
        type: string
        format: uuid
    RouteId:
      in: path
      name: routeId
      required: true
      schema:
        type: string
        format: uuid
    BundleId:
      in: path
      name: bundleId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ShopperReference:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,100}$'
      maxLength: 100
      description: Private opaque reference, never raw PII, receipt contents or URLs. Format does not verify identity or evidence.
    ShopperAssignment:
      type: object
      additionalProperties: false
      required: [orderId, shopperActor, completionAmountCents, jurisdictionRef]
      properties:
        orderId: { type: string, format: uuid }
        shopperActor:
          $ref: '#/components/schemas/ShopperReference'
        completionAmountCents: { type: integer, minimum: 1, maximum: 100000000 }
        jurisdictionRef:
          $ref: '#/components/schemas/ShopperReference'
    ShopperCompletion:
      type: object
      additionalProperties: false
      required: [itemsConfirmed, substitutionsConfirmed, receiptRef, handoffRef]
      properties:
        itemsConfirmed: { type: boolean, const: true }
        substitutionsConfirmed: { type: boolean, const: true }
        receiptRef:
          $ref: '#/components/schemas/ShopperReference'
        handoffRef:
          $ref: '#/components/schemas/ShopperReference'
    ShopperTask:
      type: object
      required: [id, orderId, shopperActor, assignedBy, merchantId, completionAmountCents, currency, jurisdictionRef, eligibilityStatus, paymentStatusAtAssignment, createdAt, status, completion, earnings]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        shopperActor: { type: string }
        assignedBy: { type: string }
        merchantId: { type: string, format: uuid }
        completionAmountCents: { type: integer, minimum: 1, maximum: 100000000 }
        currency: { type: string, const: usd }
        jurisdictionRef: { type: string }
        eligibilityStatus: { type: string, const: pending_review }
        paymentStatusAtAssignment: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [assigned, verified_completed] }
        completion:
          type: [object, 'null']
          required: [verifiedBy, itemsConfirmed, substitutionsConfirmed, receiptRef, handoffRef, paymentStatusAtCompletion, createdAt]
          properties:
            verifiedBy: { type: string }
            itemsConfirmed: { type: boolean, const: true }
            substitutionsConfirmed: { type: boolean, const: true }
            receiptRef: { type: string }
            handoffRef: { type: string }
            paymentStatusAtCompletion: { type: string }
            createdAt: { type: string, format: date-time }
        earnings:
          type: [object, 'null']
          required: [kind, status, completionAmountCents, currency, createdAt]
          properties:
            kind: { type: string, const: earned_per_order }
            status: { type: string, const: pending_review }
            completionAmountCents: { type: integer, minimum: 1, maximum: 100000000 }
            currency: { type: string, const: usd }
            createdAt: { type: string, format: date-time }
    FinanceCents:
      type: integer
      minimum: 0
      maximum: 100000000
      description: USD integer cents, nonnegative, maximum $1 million per input
    FinanceQuantity:
      type: integer
      minimum: 0
      maximum: 100000
    FinancePeriod:
      type: string
      pattern: '^(20[0-9]{2}|2100)-(0[1-9]|1[0-2])$'
      description: UTC accounting month YYYY-MM, 2000 through 2100 inclusive
    FinanceScenario:
      type: object
      additionalProperties: false
      required: [dropsPerBundle]
      description: Planning only; no scenario applies to checkout or worker pay. Omitted inputs are zero; editable base fees are assumptions. The extra pickup platform rate is fixed at 25 basis points (0.25 percent) of merchandise subtotal per extra pickup per checkout, rounded half up once. Driver pickup count is independently per bundle, never charged to each checkout. Expected fast fees floor and worker premiums ceil per checkout. All calculations use integer cents. Operational test-only checkout configuration is separate; no live pricing, payouts or radius eligibility is enabled by this calculator.
      properties:
        checkouts: { $ref: '#/components/schemas/FinanceQuantity' }
        merchandiseSubtotalCents:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Merchandise only per checkout; exclude tax, tips, delivery, service and priority fees. Planning assumption, not a checkout customer input.
        additionalPickupsPerCheckout:
          type: integer
          minimum: 0
          maximum: 100
          description: Platform pricing scope; max(distinct pickup locations minus 1, 0) per checkout. Same-store orders count once. Independent of driver additionalPickupsPerBundle and dropsPerBundle.
        deliveryFeeCents: { $ref: '#/components/schemas/FinanceCents' }
        serviceFeeCents:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Assumed fixed platform/service fee once per checkout; no amount approved and no additional maintenance customer fee
        assumedPaidMerchants: { $ref: '#/components/schemas/FinanceQuantity' }
        subscriptionCents: { $ref: '#/components/schemas/FinanceCents' }
        driverBaseCents:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Guarantee per bundle, excluding separately entered original and additional pickup pay to avoid double counting
        originalPickupCents:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Original pickup pay per bundle, additive to base, mileage and time. Each extra pickup adds 50 percent of this input, rounded half up to cents (501 becomes 251), not half the base guarantee.
        additionalPickupsPerBundle:
          type: integer
          minimum: 0
          maximum: 100
          description: Extra pickups per bundle; do not multiply customer fees, checkout drops or shopper costs by this count
        pickupRadiusMilliMiles:
          type: integer
          minimum: 0
          maximum: 500
          description: Planning metadata only in thousandths of a mile, measured for every extra store from FIRST pickup, never a chain. Dense-city initial target 250; outer cap 500. Omitted is zero, UI starts at 500. Does not test distance or affect dispatch eligibility.
        shopperCentsPerCheckout:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Ordinary cost for a separate shopper preparing orders for driver pickup, per checkout, not automatically per pickup. Exclude from other variable costs or staff payroll to avoid duplication.
        fastServiceAdoptionBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: Hypothetical customer uptake of optional fast shopping/delivery priority, not actual selection or guaranteed times. 100 basis points is 1 percent. Fees and premiums below are per opted-in checkout.
        fastShoppingFeeCents: { $ref: '#/components/schemas/FinanceCents' }
        fastDeliveryFeeCents: { $ref: '#/components/schemas/FinanceCents' }
        fastShopperPremiumCents: { $ref: '#/components/schemas/FinanceCents' }
        fastDriverPremiumCents:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Additional driver cost per opted-in checkout, not per bundle
        bundleMilliMiles:
          allOf: [{ $ref: '#/components/schemas/FinanceQuantity' }]
          description: Thousandths of a mile per bundle, not meters
        mileageCentsPerMile: { $ref: '#/components/schemas/FinanceCents' }
        bundleSeconds:
          allOf: [{ $ref: '#/components/schemas/FinanceQuantity' }]
          description: Seconds per bundle, including assumed waiting and service time
        timeCentsPerHour: { $ref: '#/components/schemas/FinanceCents' }
        dropsPerBundle: { type: integer, minimum: 1, maximum: 100 }
        processingExcessCents:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Platform-borne processing excess per checkout AFTER existing merchant allocation
        refundLossCents:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Unrecovered platform loss per checkout, not gross customer refund
        manualVariableCents: { $ref: '#/components/schemas/FinanceCents' }
        hostingCents: { $ref: '#/components/schemas/FinanceCents' }
        maintenanceCents:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Monthly recurring platform maintenance/support cost, included in fixed costs. Optional and omitted is zero (no approved budget, not zero actual cost). Exclude other overhead and support staffing already in payroll; not a customer fee.
        overheadCents: { $ref: '#/components/schemas/FinanceCents' }
        payrollCents:
          allOf: [{ $ref: '#/components/schemas/FinanceCents' }]
          description: Monthly staff overhead; do not duplicate modeled driver or per-checkout shopper costs
    FinanceScenarioResult:
      type: object
      required: [kind, additionalPickupPlatformFeeBasisPoints, additionalPickupPlatformFeePerCheckoutCents, additionalPickupPlatformFeeMonthCents, customerFeesPerCheckoutCents, customerFeesMonthCents, platformServiceFeesMonthCents, deliveryFeesMonthCents, subscriptionForecastCents, driverBundleCents, driverPerCheckoutCents, driverMonthCents, additionalPickupCents, pickupAddonBundleCents, pickupBundleCents, pickupRadiusMilliMiles, shopperPerCheckoutCents, shopperMonthCents, fastFeesPerCheckoutCents, fastFeesMonthCents, fastShopperPremiumPerCheckoutCents, fastShopperPremiumMonthCents, fastDriverPremiumPerCheckoutCents, fastDriverPremiumMonthCents, contributionPerCheckoutCents, contributionNumeratorCents, contributionDenominator, contributionMonthCents, fixedMonthCents, maintenanceMonthCents, platformRevenueForecastCents, netOperatingCents, netMarginBasisPoints, breakEvenCheckouts]
      properties:
        kind: { type: string, const: estimate }
        additionalPickupPlatformFeeBasisPoints: { type: integer, const: 25 }
        additionalPickupPlatformFeePerCheckoutCents: { type: integer, description: Half up once on merchandiseSubtotalCents times 25 times additionalPickupsPerCheckout divided by 10000; already included in fees and contribution }
        additionalPickupPlatformFeeMonthCents: { type: integer, description: Per-checkout surcharge times checkouts; included once in customer fees and platform revenue forecast }
        customerFeesPerCheckoutCents: { type: integer, description: Regular delivery/service plus expected fast fees plus extra pickup platform fee }
        customerFeesMonthCents: { type: integer, description: All forecast customer fees including extra pickup platform fee; breakdowns already included }
        platformServiceFeesMonthCents: { type: integer, description: serviceFeeCents times checkouts; already included in customerFeesMonthCents and platformRevenueForecastCents; not an extra fee or automatic worker payout }
        deliveryFeesMonthCents: { type: integer, description: deliveryFeeCents times checkouts; already included in customerFeesMonthCents and platformRevenueForecastCents; not driver compensation }
        subscriptionForecastCents: { type: integer }
        driverBundleCents: { type: integer, description: Base plus original/additional pickups plus rounded mileage/time; excludes per-checkout fast driver premium }
        driverPerCheckoutCents: { type: integer, description: Rounded bundle amortization display plus expected per-checkout fast driver premium }
        driverMonthCents: { type: integer, description: Ceil of regular bundle cost times checkouts over drops plus fastDriverPremiumMonthCents }
        additionalPickupCents: { type: integer, description: Each extra pickup amount, 50 percent of original rounded half up }
        pickupAddonBundleCents: { type: integer, description: Additional pickups only, included in driverBundleCents }
        pickupBundleCents: { type: integer, description: Original plus all additional pickups, included in driverBundleCents }
        pickupRadiusMilliMiles: { type: integer, minimum: 0, maximum: 500, description: Echoed planning metadata; not route eligibility }
        shopperPerCheckoutCents: { type: integer, description: Ordinary shopper cost plus expected fast shopper premium }
        shopperMonthCents: { type: integer, description: Separate shopper cost including fastShopperPremiumMonthCents }
        fastFeesPerCheckoutCents: { type: integer, description: Floor of combined fast fees times uptake basis points divided by 10000 }
        fastFeesMonthCents: { type: integer, description: Expected fast fees per checkout times checkouts; included in customer revenue }
        fastShopperPremiumPerCheckoutCents: { type: integer, description: Ceil of opted-in shopper premium times uptake basis points divided by 10000 }
        fastShopperPremiumMonthCents: { type: integer, description: Expected shopper premium per checkout times checkouts; included in shopper cost }
        fastDriverPremiumPerCheckoutCents: { type: integer, description: Ceil of opted-in driver premium times uptake basis points divided by 10000 }
        fastDriverPremiumMonthCents: { type: integer, description: Expected driver premium per checkout times checkouts; included in driver cost }
        contributionPerCheckoutCents: { type: integer, description: Rounded display only }
        contributionNumeratorCents: { type: integer, description: Exact contribution numerator after conservative per-checkout fast rounding and separate shopper costs }
        contributionDenominator: { type: integer, description: Checkout drops per bundle }
        contributionMonthCents: { type: integer }
        fixedMonthCents: { type: integer, description: Monthly hosting plus maintenance plus other overhead plus payroll }
        maintenanceMonthCents: { type: integer, description: maintenanceCents echoed for display; already included in fixedMonthCents; not a customer fee }
        platformRevenueForecastCents: { type: integer, description: Customer fees plus assumed subscriptions before costs; forecast income not net actual revenue or profit; priority worker allocations are not profit }
        netOperatingCents: { type: integer }
        netMarginBasisPoints:
          type: [integer, 'null']
          description: Nearest basis point of net operating result / (customer fees + assumed subscriptions); excludes merchandise, tax, tips. Null when denominator is zero.
        breakEvenCheckouts:
          type: [integer, 'null']
          description: Smallest checkout count with nonnegative calculated net under conservative rounding when contribution is positive, after subscriptions offset fixed costs; null if contribution <= 0 even when subscriptions cover fixed costs. Forecast count is not guaranteed demand or capacity.
    FinanceCostRequest:
      type: object
      additionalProperties: false
      required: [period, category, amountCents]
      properties:
        period: { $ref: '#/components/schemas/FinancePeriod' }
        category: { type: string, enum: [driver, staff, hosting, processing_excess, refund_loss, other] }
        amountCents: { $ref: '#/components/schemas/FinanceCents' }
    FinanceCost:
      type: object
      required: [id, period, category, amountCents, actor, createdAt, kind]
      properties:
        period: { $ref: '#/components/schemas/FinancePeriod' }
        category: { type: string, enum: [driver, staff, hosting, processing_excess, refund_loss, other] }
        amountCents: { $ref: '#/components/schemas/FinanceCents' }
        id: { type: string, format: uuid }
        actor: { type: string, maxLength: 200 }
        createdAt: { type: string, format: date-time }
        kind: { type: string, const: manual_cost }
    FinanceCostReport:
      type: object
      properties:
        kind: { type: string, const: manual_cost_report }
        period: { $ref: '#/components/schemas/FinancePeriod' }
        totalCents: { type: string, pattern: '^[0-9]+$', description: Exact decimal integer string for the entire month, avoiding JavaScript integer overflow }
        limit: { type: integer }
        offset: { type: integer }
        costs:
          type: array
          items: { $ref: '#/components/schemas/FinanceCost' }
    NearbyMerchant:
      type: object
      required: [merchantId, name, merchantType, storeLocationId, distanceMeters]
      properties:
        merchantId:
          type: string
          format: uuid
        name:
          type: string
        merchantType:
          type: string
          enum: [retail, grocery]
        storeLocationId:
          type: string
          format: uuid
        distanceMeters:
          type: number
          maximum: 500
    CatalogItem:
      type: object
      required: [id, name, description, unitPriceCents, volumeLiters]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        unitPriceCents:
          type: integer
          minimum: 1
        volumeLiters:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
    MerchantCatalogItem:
      allOf:
        - $ref: '#/components/schemas/CatalogItem'
        - type: object
          required: [storeLocationId, available]
          properties:
            storeLocationId:
              type: string
              format: uuid
            available:
              type: boolean
    CreateMerchantCatalogItem:
      type: object
      additionalProperties: false
      required: [storeLocationId, name, description, unitPriceCents, volumeLiters]
      properties:
        storeLocationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        unitPriceCents:
          type: integer
          minimum: 1
          maximum: 10000000
        volumeLiters:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
          multipleOf: 0.01
    UpdateMerchantCatalogItem:
      type: object
      additionalProperties: false
      required: [name, description, unitPriceCents, volumeLiters, available]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        unitPriceCents:
          type: integer
          minimum: 1
          maximum: 10000000
        volumeLiters:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
          multipleOf: 0.01
        available:
          type: boolean
    CreateCustomerOrder:
      type: object
      additionalProperties: false
      required: [storeLocationId, dropoff, deliveryWindowStart, deliveryWindowEnd, items]
      properties:
        storeLocationId:
          type: string
          format: uuid
        dropoff:
          $ref: '#/components/schemas/GeoPoint'
        deliveryWindowStart:
          type: string
          format: date-time
        deliveryWindowEnd:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [catalogItemId, quantity]
            properties:
              catalogItemId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 99
    CreateCheckoutRequest:
      type: object
      additionalProperties: false
      description: Orders may come from the anchor plus at most one adjacent merchant. Extra pickup pricing is controlled only by server test configuration; count and merchandise basis come from actual accepted orders and merchant_items invoice lines. No customer-supplied count, subtotal or rate is accepted. First pickup is included; same-location orders count once. Existing geographic rules are unchanged; no 0.5-mile radius qualification is asserted.
      required: [anchorStoreLocationId, orderIds, dropoff, deliveryWindowStart, deliveryWindowEnd]
      properties:
        priorityService:
          type: boolean
          default: false
          description: Optional combined priority service choice; both surcharges go entirely to their respective pending shopper/driver allocation snapshots, not earned/paid worker costs. Null is rejected.
        anchorStoreLocationId:
          type: string
          format: uuid
        orderIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        dropoff:
          $ref: '#/components/schemas/GeoPoint'
        deliveryWindowStart:
          type: string
          format: date-time
        deliveryWindowEnd:
          type: string
          format: date-time
    Checkout:
      type: object
      required: [id, status, currency, invoiceLines, totalCents, priority]
      properties:
        extraPickup:
          type: object
          description: Immutable server quote snapshot for new checkouts; omitted on pre-011 retries. Rate always 25 basis points; amount zero when disabled. Test-only state also applies to zero-extra invoices and requires a test payment gateway. Basis excludes all fees, tax and tips; snapshot retries never reprice.
          required: [testOnly, merchandiseSubtotalCents, additionalPickups, rateBasisPoints, amountCents]
          properties:
            testOnly: { type: boolean }
            merchandiseSubtotalCents: { type: integer, minimum: 1, maximum: 2147483647 }
            additionalPickups: { type: integer, minimum: 0, maximum: 100 }
            rateBasisPoints: { type: integer, const: 25 }
            amountCents: { type: integer, minimum: 0, maximum: 2147483647 }
        priority:
          type: object
          required: [selected, testOnly, shoppingCents, deliveryCents, shopperAllocationCents, driverAllocationCents, allocationStatus]
          properties:
            selected: { type: boolean }
            testOnly: { type: boolean }
            shoppingCents: { type: integer, minimum: 0, maximum: 1000000 }
            deliveryCents: { type: integer, minimum: 0, maximum: 1000000 }
            shopperAllocationCents: { type: integer, minimum: 0, maximum: 1000000 }
            driverAllocationCents: { type: integer, minimum: 0, maximum: 1000000 }
            allocationStatus: { type: string, enum: [pending_fulfillment, not_applicable] }
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [building, quoted, paid, cancelled, completed]
        currency:
          type: string
          enum: [usd]
        invoiceLines:
          type: array
          items:
            type: object
            required: [type, amountCents]
            properties:
              type:
                type: string
                enum: [merchant_items, delivery_fee, service_fee, dc_surcharge, priority_shopping, priority_delivery, extra_pickup_platform_fee]
              merchantId:
                type: string
                format: uuid
              amountCents:
                type: integer
                minimum: 0
        totalCents:
          type: integer
          minimum: 0
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    DriverLocation:
      type: object
      additionalProperties: false
      required: [eventId, observedAt, location]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        observedAt:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/GeoPoint'
    DriverRouteStopEvent:
      type: object
      additionalProperties: false
      required: [eventId, type, observedAt]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [arrive, complete]
        observedAt:
          type: string
          format: date-time
    CreateBundleRequest:
      type: object
      additionalProperties: false
      required: [seedOrderId, capacityLiters]
      properties:
        seedOrderId:
          type: string
          format: uuid
        capacityLiters:
          type: number
          exclusiveMinimum: 0
        maxOrders:
          type: integer
          minimum: 1
          default: 3
        pickupRadiusMeters:
          type: integer
          minimum: 0
          default: 2000
        dropoffRadiusMeters:
          type: integer
          minimum: 0
          default: 2000
    Bundle:
      type: object
      required: [id, status, stops]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, in_progress, completed, cancelled]
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
    Stop:
      type: object
      required: [id, orderId, sequence, type, latitude, longitude, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [pickup, dropoff]
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        status:
          type: string
          enum: [pending, arrived, completed, skipped]
    StopEvent:
      type: object
      additionalProperties: false
      required: [eventId, type, observedAt]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [arrived, completed, skipped]
        observedAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
