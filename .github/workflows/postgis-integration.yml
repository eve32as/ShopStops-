name: PostGIS integration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: shopstops
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopstops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Apply migrations and run SQL fixtures
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/shopstops?sslmode=disable
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          for fixture in db/tests/*.sql; do
            echo "Running ${fixture}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$fixture"
          done
