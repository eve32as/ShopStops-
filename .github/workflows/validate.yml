name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  database:
    name: PostgreSQL/PostGIS migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: shopstops
          POSTGRES_USER: shopstops
          POSTGRES_PASSWORD: local-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopstops -d shopstops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply ordered migrations and SQL tests
        env:
          PGPASSWORD: local-test-password
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          for migration in db/migrations/*.sql; do
            psql --host=localhost --username=shopstops --dbname=shopstops --set ON_ERROR_STOP=1 --file "$migration"
          done
          for test_file in db/tests/*.sql; do
            psql --host=localhost --username=shopstops --dbname=shopstops --set ON_ERROR_STOP=1 --file "$test_file"
          done

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: terraform -chdir=deploy/aws fmt -check -recursive
      - run: terraform -chdir=deploy/aws init -backend=false -input=false
      - run: terraform -chdir=deploy/aws validate

  clients:
    name: ${{ matrix.app }} client checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - if: matrix.app == 'admin'
        run: npm run lint
        working-directory: apps/admin
      - if: matrix.app == 'admin'
        run: npm run build
        working-directory: apps/admin
      - if: matrix.app == 'mobile'
        run: npm run typecheck
        working-directory: apps/mobile
